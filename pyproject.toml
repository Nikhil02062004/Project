[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queuectl"
version = "0.1.0"
description = "A CLI-based background job queue system"
authors = [
    {name = "QueueCTL Team", email = "example@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.7"
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
queuectl = "queuectl.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/queuectl"
Repository = "https://github.com/yourusername/queuectl"
Issues = "https://github.com/yourusername/queuectl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["queuectl*"]